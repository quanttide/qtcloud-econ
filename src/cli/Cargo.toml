[package]
name = "qtcloud-econ-cli"
version = "0.1.0"
edition = "2021"
description = "量潮经济云命令行工具"
authors = ["QuantTide <opensource@quanttide.com>"]
license = "Apache-2.0"
repository = "https://github.com/quanttide/qtcloud-econ"

[lib]
name = "qtcloud_econ_cli"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "qtcloud-econ"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
